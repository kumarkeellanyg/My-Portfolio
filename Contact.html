    <section id="contact">

        <h2>Contact Me</h2>



        <form>


            <label for="fullname">Full Name:</label>
            <input type="text" placeholder="Enter your full name" required>

            <br><br>



            <label for="email">Email:</label>
            <input type="email"  placeholder="Enter your email" required>

            <br><br>



            <label for="phone">Phone Number:</label>
            <input type="tel"  placeholder="Enter your phone number">

            <br><br>


            <label for="date">Preferred Contact Date:</label>
            <input type="date" >

            <br><br>



            <label for="time">Preferred Contact Time:</label>
            <input type="time" >

            <br><br>



            <fieldset>

                <legend>Preferred Contact Method</legend>

                <input type="radio" name="contact-method" value="email" checked>
                <label>Email</label>

                <input type="radio" name="contact-method" value="phone">
                <label>Phone</label>

            </fieldset>

            <br>






            <label for="message">Message:</label>

            <br>

            <textarea rows="6" cols="50" placeholder="Write your message here..." required></textarea>

            <br><br>


        </form>

    </section>
